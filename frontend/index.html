<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100d0e" />
    <meta
      name="description"
      content="Daemon brings your campaign conversations, strategy, creative work and approvals together in one connected workspace."
    />
    <title>Daemon — Your next campaign starts here</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("daemon.theme") === "light" ? "light" : "dark";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
